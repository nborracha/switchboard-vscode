name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm run lint

      - name: Build and package
        run: |
          pnpm run build
          pnpm exec vsce package --no-dependencies --out switchboard-${{ github.ref_name }}.vsix
          # A second, unversioned copy gives the README install one-liner a stable URL:
          # https://github.com/<owner>/<repo>/releases/latest/download/switchboard.vsix
          cp switchboard-${{ github.ref_name }}.vsix switchboard.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
